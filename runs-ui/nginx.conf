server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  # Docker assigns a new IP when `agents` is recreated. Resolve the service
  # name at request time instead of retaining Nginx's startup-time address.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $agent_upstream agents:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$agent_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
    # Finance/research runs can retrieve reports and generate locally for
    # several minutes. Avoid Nginx's default 60-second SSE read timeout.
    proxy_read_timeout 15m;
    proxy_send_timeout 15m;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
