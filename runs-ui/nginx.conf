server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://agents:8000/;
    proxy_http_version 1.1;
    proxy_buffering off;
    # Finance/research runs can retrieve reports and generate locally for
    # several minutes. Avoid Nginx's default 60-second SSE read timeout.
    proxy_read_timeout 15m;
    proxy_send_timeout 15m;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
