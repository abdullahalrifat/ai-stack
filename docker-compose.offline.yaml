services:
  # Offline mode disables external search and cloud-provider credentials.
  # The dedicated inference VM remains reachable over the private network.
  searxng:
    profiles: ["online"]

  server:
    environment:
      WEB_SEARCH_ENABLED: "false"
      ANTHROPIC_MODEL: ""
      ANTHROPIC_API_KEY: ""
      HF_MODEL: ""
      HF_INFERENCE_BASE_URL: ""
      HF_API_KEY: ""
