name: One-time CI fixup

on:
  push:
    branches:
      - fix/ci-validation-regressions

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-validation-regressions
          fetch-depth: 0
      - name: Patch stale permission and runner tests
        shell: python
        run: |
          from pathlib import Path

          p = Path("server/tests/test_filesystem.py")
          text = p.read_text()
          old = '''    with filesystem.workspace_context(str(workspace)):\n        result = filesystem.run_tests.invoke(\n            {\n                "kind": "pytest_coverage",\n                "directory": ".",\n                "coverage_target": "app",\n            }\n        )\n'''
          new = '''    with permissions_context(\n        PermissionPolicy(scope=FULL_WRITE),\n    ), filesystem.workspace_context(str(workspace)):\n        result = filesystem.run_tests.invoke(\n            {\n                "kind": "pytest_coverage",\n                "directory": ".",\n                "coverage_target": "app",\n            }\n        )\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    with filesystem.workspace_context(str(workspace)):\n        result = filesystem.run_tests.invoke(\n            {\n                "kind": "pytest",\n                "test_path": "tests/test_worker.py::test_retry",\n            }\n        )\n'''
          new = '''    with permissions_context(\n        PermissionPolicy(scope=FULL_WRITE),\n    ), filesystem.workspace_context(str(workspace)):\n        result = filesystem.run_tests.invoke(\n            {\n                "kind": "pytest",\n                "test_path": "tests/test_worker.py::test_retry",\n            }\n        )\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    with filesystem.workspace_context(str(workspace)):\n        result = filesystem.run_tests.invoke(\n            {"kind": "ruff", "test_path": "app/worker.py"}\n        )\n'''
          new = '''    with permissions_context(\n        PermissionPolicy(scope=FULL_WRITE),\n    ), filesystem.workspace_context(str(workspace)):\n        result = filesystem.run_tests.invoke(\n            {"kind": "ruff", "test_path": "app/worker.py"}\n        )\n'''
          assert old in text
          text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path("server/tests/test_runner.py")
          text = p.read_text()
          old = '''    reader = threading.Thread(target=lambda: None)\n    runner._watch_job(job, reader)\n'''
          new = '''    reader = threading.Thread(target=lambda: None)\n    reader.start()\n    runner._watch_job(job, reader)\n'''
          assert old in text
          p.write_text(text.replace(old, new, 1))

          p = Path(".github/workflows/ci-fixup-once.yml")
          p.unlink()
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/tests/test_filesystem.py server/tests/test_runner.py .github/workflows/ci-fixup-once.yml
          git diff --cached --check
          git commit -m "test: align runner tests with permission and lifecycle contracts"
          git push origin fix/ci-validation-regressions
