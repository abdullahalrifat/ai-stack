name: Apply CI fixup once

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted fixes
        shell: python
        run: |
          from pathlib import Path

          p = Path("server/app/tools/filesystem.py")
          text = p.read_text()
          old = '''    try:\n        active_policy().check_command(commands[kind][0])\n    except Exception as e:\n        return {"error": str(e)}\n\n    if kind == "pytest_coverage":\n'''
          new = '''    if kind == "pytest_coverage":\n'''
          if old not in text:
              raise SystemExit("filesystem permission block not found")
          p.write_text(text.replace(old, new, 1))

          old = '''    if kind not in commands:\n        return {"error": f"Unsupported test kind: {kind}"}\n    try:\n        cwd = resolve_path(directory)\n'''
          new = '''    if kind not in commands:\n        return {"error": f"Unsupported test kind: {kind}"}\n    try:\n        active_policy().check_command(commands[kind][0])\n    except Exception as e:\n        return {"error": str(e)}\n    try:\n        cwd = resolve_path(directory)\n'''
          if old not in text:
              raise SystemExit("filesystem insertion point not found")
          p.write_text(p.read_text().replace(old, new, 1))

          trigger = Path(".github/ci/.trigger-2026-09-05-server-fix")
          if trigger.exists():
              trigger.unlink()
          Path(".github/workflows/ci-fixup-once.yml").unlink()
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/app/tools/filesystem.py .github/ci/.trigger-2026-09-05-server-fix .github/workflows/ci-fixup-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: apply test permission check after command expansion"
          git fetch origin fix/ci-validation-regressions
          git rebase origin/fix/ci-validation-regressions
          git push origin HEAD:fix/ci-validation-regressions
