name: Repair CI test assumptions

on:
  push:
    branches: ["fix/ci-validation-regressions"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-validation-regressions
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Align stale tests with current contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("server/tests/test_filesystem.py")
          text = path.read_text(encoding="utf-8")
          old = 'policy = PermissionPolicy(command_allowlist=frozenset({"pytest"}))'
          new = 'policy = PermissionPolicy(command_allowlist=frozenset())'
          if old not in text:
              raise SystemExit("filesystem test contract anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("server/tests/test_runner.py")
          text = path.read_text(encoding="utf-8")
          old = "    runner._watch_job(job)\n"
          new = "    reader = threading.Thread(target=lambda: None)\n    runner._watch_job(job, reader)\n"
          if old not in text:
              raise SystemExit("runner test call anchor not found")
          if "import threading" not in text:
              text = text.replace("import pytest\n", "import pytest\nimport threading\n", 1)
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/tests/test_filesystem.py server/tests/test_runner.py .github/workflows/repair-ci-tests.yml
          git commit -m "test: align stale runner and permission assumptions"
          git rm .github/workflows/repair-ci-tests.yml
          git commit -m "chore: remove one-off CI repair workflow"
          git push origin HEAD:fix/ci-validation-regressions
