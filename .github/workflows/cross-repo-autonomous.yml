name: Core Protocol Conformance

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-conformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: jarvis-ci
          POSTGRES_DB: jarvis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis -d jarvis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_URL: postgresql://jarvis:jarvis-ci@127.0.0.1:5432/jarvis
      AGENT_API_KEY: protocol-ci-agent-key
      RUNNER_API_KEY: protocol-ci-runner-key
      WORKSPACE_DIR: /tmp/ai-stack-protocol-workspace
      DEFAULT_WORKSPACE_DIR: /tmp/ai-stack-protocol-workspace
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.lock
      - name: Install AI Stack independently
        run: python -m pip install -r requirements.lock
      - name: Verify neutral Core identity
        run: |
          # Core 0.14.0 is the published common-brain contract.
          python -c "import importlib.metadata as m; assert m.version('jarvis-agent-core') == '0.14.0'"
          python -c "from jarvis_core import ApprovalDecision, Capability, ExecutionProof, ModelProvider, ModelRequest, ModelResponse, ModelUsage, SandboxRequirements, ToolCall, normalize_usage, normalize_tool_call; assert all((ApprovalDecision, Capability, ExecutionProof, ModelProvider, ModelRequest, ModelResponse, ModelUsage, SandboxRequirements, ToolCall, normalize_usage, normalize_tool_call))"
          python -c "from jarvis_core.execution_maturity import Checkpoint, ProcessHandle, SteeringCommand; assert all((Checkpoint, ProcessHandle, SteeringCommand))"
      - name: Run protocol and fencing conformance tests
        run: >-
          python -m pytest -q
          tests/test_v08_autonomous_runtime.py
          tests/test_v08_platform_contracts.py
          tests/test_v08_autonomous_postgres_integration.py
      - name: Assert no CLI application dependency
        run: |
          python - <<'PY'
          import importlib.util
          from app.platform.autonomous_store import AutonomousPlatformStore

          assert importlib.util.find_spec("jarvis_cli") is None
          store = AutonomousPlatformStore()
          store.runs.initialize()
          task = store.submit_cloud(
              {"task": "protocol smoke", "model": "auto"},
              idempotency_key="core-protocol-smoke-v1",
          )
          claimed = store.claim_cloud("protocol-worker", 30)
          assert claimed and str(claimed["id"]) == str(task["id"])
          PY
