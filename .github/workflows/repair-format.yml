name: Repair formatting

on:
  push:
    branches: ["fix/ci-validation-regressions"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-validation-regressions
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install formatter
        working-directory: server
        run: python -m pip install -q black==26.5.1
      - name: Format changed tests
        working-directory: server
        run: black tests/test_runner.py tests/test_filesystem.py
      - name: Commit formatting and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/tests/test_runner.py server/tests/test_filesystem.py .github/workflows/repair-format.yml
          git commit -m "style: format updated CI tests"
          git rm .github/workflows/repair-format.yml
          git commit -m "chore: remove one-off formatting workflow"
          git push origin HEAD:fix/ci-validation-regressions
