name: Remote provider smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe configured remote providers
        env:
          REMOTE_OPENAI_BASE_URL: ${{ secrets.REMOTE_OPENAI_BASE_URL }}
          REMOTE_OPENAI_MODEL: ${{ secrets.REMOTE_OPENAI_MODEL }}
          REMOTE_OPENAI_API_KEY: ${{ secrets.REMOTE_OPENAI_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tests/integration/remote_provider_smoke.py
