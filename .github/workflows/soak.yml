name: control-plane-soak

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Staging soak duration in hours (minimum 24)"
        required: false
        default: "24"
  schedule:
    - cron: "23 2 * * 0"
  push:
    branches: [main]
    paths:
      - "scripts/worker_soak.py"
      - ".github/workflows/soak.yml"
  pull_request:
    paths:
      - "scripts/worker_soak.py"
      - ".github/workflows/soak.yml"

permissions:
  contents: read

jobs:
  harness-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate harness syntax
        run: python -m py_compile scripts/worker_soak.py scripts/backup_restore_dr_check.py
      - name: Start disposable health/readiness fixture
        run: |
          cat > /tmp/soak_fixture.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import json
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/health":
                      body = {"status": "ok"}
                  elif self.path == "/ready":
                      body = {"status": "ready"}
                  else:
                      self.send_error(404)
                      return
                  encoded = json.dumps(body).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(encoded)))
                  self.end_headers()
                  self.wfile.write(encoded)
              def log_message(self, *_args):
                  pass
          HTTPServer(("127.0.0.1", 8765), Handler).serve_forever()
          PY
          nohup python /tmp/soak_fixture.py >/tmp/soak-fixture.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/health && break || sleep 1; done
      - name: Run the actual soak harness against the disposable fixture
        run: python scripts/worker_soak.py --url http://127.0.0.1:8765 --hours 0.001 --interval 1 --readiness --report worker-soak-smoke.json
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-soak-smoke-${{ github.sha }}
          path: worker-soak-smoke.json
          if-no-files-found: warn

  staging-soak:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.AI_STACK_SOAK_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate requested duration
        env:
          SOAK_HOURS: ${{ inputs.hours || '24' }}
        run: python -c "import os; h=float(os.environ['SOAK_HOURS']); assert h >= 24, 'staging soak must run at least 24 hours'; print(f'Running {h} hour staging soak')"
      - name: Run staging health/readiness soak
        env:
          AI_STACK_SOAK_URL: ${{ vars.AI_STACK_SOAK_URL }}
          SOAK_HOURS: ${{ inputs.hours || '24' }}
        run: python scripts/worker_soak.py --url "$AI_STACK_SOAK_URL" --hours "$SOAK_HOURS" --interval 30 --readiness --report worker-soak-report.json
      - name: Upload retained staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-soak-${{ github.sha }}
          path: worker-soak-report.json
          if-no-files-found: warn
