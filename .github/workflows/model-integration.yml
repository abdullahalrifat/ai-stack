name: Model integration

on:
  pull_request:
    paths:
      - "litellm/**"
      - "server/**"
      - "tests/integration/**"
      - ".github/workflows/model-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ollama-litellm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start real Ollama and LiteLLM
        run: docker compose -f tests/integration/docker-compose.yml up -d --build --wait
      - name: Exercise native tool calling
        run: python tests/integration/tool_call_smoke.py
      - name: Capture diagnostics
        if: failure()
        run: docker compose -f tests/integration/docker-compose.yml logs --no-color
      - name: Stop integration stack
        if: always()
        run: docker compose -f tests/integration/docker-compose.yml down -v
