name: Repair runner import formatting

on:
  push:
    branches: ["fix/ci-validation-regressions"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-validation-regressions
      - name: Normalize imports
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("server/tests/test_runner.py")
          s = p.read_text()
          s = s.replace("import time\n\nimport threading\n\nimport pytest", "import threading\nimport time\n\nimport pytest", 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/tests/test_runner.py .github/workflows/repair-runner-import.yml
          git commit -m "style: normalize runner test imports"
          git rm .github/workflows/repair-runner-import.yml
          git commit -m "chore: remove one-off runner import workflow"
          git push origin HEAD:fix/ci-validation-regressions
