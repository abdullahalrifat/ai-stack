name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Verify coordinated Core
        run: python -c "import importlib.metadata as m; assert m.version('jarvis-agent-core') == '0.8.0'"
      - name: Syntax and import safety
        run: python -m compileall -q app
      - name: Critical lint
        run: ruff check app tests --select E9,F63,F7,F82
      - name: Tests and coverage floor
        run: python -m pytest -q tests --cov=app --cov-report=term-missing --cov-fail-under=67

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: jarvis-ci
          POSTGRES_DB: jarvis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis -d jarvis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_URL: postgresql://jarvis:jarvis-ci@127.0.0.1:5432/jarvis
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Verify coordinated Core
        run: python -c "import importlib.metadata as m; assert m.version('jarvis-agent-core') == '0.8.0'"
      - name: Run durable lease and autonomous fencing tests
        run: >-
          python -m pytest -q
          tests/test_postgres_leases_integration.py
          tests/test_v08_autonomous_postgres_integration.py

  runs-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runs-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runs-ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          AGENT_API_KEY: ci-only-placeholder
          POSTGRES_PASSWORD: ci-only-placeholder
          LITELLM_MASTER_KEY: ci-only-placeholder
        run: docker compose config --quiet
