name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  JARVIS_CORE_REF: e1aac1e25f776b0cb329424b95a419ce7a42d415

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned shared runtime
        uses: actions/checkout@v4
        with:
          repository: abdullahalrifat/jarvis-core
          ref: ${{ env.JARVIS_CORE_REF }}
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: .deps/jarvis-core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.lock
      - name: Install locked dependencies and pinned shared runtime
        working-directory: server
        run: |
          python -m pip install -r requirements.lock
          python -m pip install ../.deps/jarvis-core
      - name: Syntax and import safety
        working-directory: server
        run: python -m compileall -q app
      - name: Critical lint
        working-directory: server
        run: ruff check app tests --select E9,F63,F7,F82
      - name: Tests and coverage floor
        working-directory: server
        run: python -m pytest -q tests --cov=app --cov-report=term-missing --cov-fail-under=67

  runs-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runs-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runs-ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          AGENT_API_KEY: ci-only-placeholder
          POSTGRES_PASSWORD: ci-only-placeholder
          LITELLM_MASTER_KEY: ci-only-placeholder
          CROSS_REPO_TOKEN: ci-only-placeholder
        run: docker compose config --quiet
