name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Syntax and import safety
        run: python -m compileall -q app
      - name: Critical lint
        run: ruff check app tests --select E9,F63,F7,F82
      - name: Tests and coverage floor
        run: python -m pytest -q tests --cov=app --cov-report=term-missing --cov-fail-under=67

  jarvis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jarvis/requirements.txt
      - name: Install CLI and development tools
        run: python -m pip install -e . -r requirements.txt
      - name: Syntax and import safety
        run: python -m compileall -q src
      - name: Format
        run: black --check src tests
      - name: Critical lint
        run: ruff check src tests --select E9,F63,F7,F82
      - name: Tests and coverage floor
        run: python -m pytest -q --cov=. --cov-report=term-missing --cov-fail-under=70
      - name: Build package
        run: python -m pip wheel --no-deps . --wheel-dir /tmp/jarvis-dist

  runs-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runs-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runs-ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          AGENT_API_KEY: ci-only-placeholder
          POSTGRES_PASSWORD: ci-only-placeholder
          LITELLM_MASTER_KEY: ci-only-placeholder
        run: docker compose config --quiet
