name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Verify coordinated Core
        run: python -c "import importlib.metadata as m; assert m.version('jarvis-agent-core') == '0.17.2'"
          python -c "from jarvis_core import InferenceClient, InferenceClientError, InferenceConfig; assert all((InferenceClient, InferenceClientError, InferenceConfig))"
      - name: Syntax and import safety
        run: python -m compileall -q app
      - name: Formatting
        run: >-
          black --check --diff
          app/runner.py
          app/platform/autonomous_store.py
          app/platform/cloud_sandbox.py
          app/api/execution_control.py
          app/integrations/github.py
          app/tools/github.py
          app/runs/evidence_bridge.py
          app/llm/empirical.py
          app/llm/routing.py
          tests/test_runner.py
          tests/test_v08_autonomous_postgres_integration.py
          tests/test_v08_autonomous_store_edge_cases.py
          tests/test_cloud_sandbox.py
          tests/test_execution_control.py
          tests/test_github_integration.py
      - name: Critical lint
        run: ruff check app tests --select E9,F63,F7,F82
      - name: Tests and coverage floor
        run: python -m pytest -q tests --cov=app --cov-report=term-missing --cov-fail-under=67
      - name: Write commit-bound certification manifest
        if: always()
        run: python ../scripts/write_certification_manifest.py ../certification-evidence.json
      - name: Upload certification evidence manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-evidence-${{ github.sha }}-server
          path: certification-evidence.json
          if-no-files-found: error

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: jarvis-ci
          POSTGRES_DB: jarvis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis -d jarvis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_URL: postgresql://jarvis:jarvis-ci@127.0.0.1:5432/jarvis
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Verify coordinated Core
        run: python -c "import importlib.metadata as m; assert m.version('jarvis-agent-core') == '0.17.2'"
      - name: Initialize PostgreSQL schema
        run: python -c "from app.runs.store import RunStore; RunStore('${POSTGRES_URL}').initialize()"
      - name: Run durable lease and autonomous fencing tests
        run: >-
          python -m pytest -q
          tests/test_postgres_leases_integration.py
          tests/test_v08_autonomous_postgres_integration.py
          tests/test_v08_autonomous_store_edge_cases.py

  runs-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runs-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runs-ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate Compose configuration
        env:
          AGENT_API_KEY: ci-only-placeholder
          POSTGRES_PASSWORD: ci-only-placeholder
          POSTGRES_USER: jarvis
          POSTGRES_DB: jarvis
          SEARXNG_SECRET: ci-only-placeholder
          PIPELINES_API_KEY: ci-only-placeholder
        run: docker compose config --quiet
      - name: Check deployment exposure and image pinning
        run: python scripts/check_deployment_safety.py
      - name: Build the standard server image
        run: docker compose build server
      - name: Start the standard runner from the locally built image
        env:
          AGENT_API_KEY: ci-only-placeholder
          POSTGRES_PASSWORD: ci-only-placeholder
          POSTGRES_USER: jarvis
          POSTGRES_DB: jarvis
          SEARXNG_SECRET: ci-only-placeholder
          PIPELINES_API_KEY: ci-only-placeholder
        run: docker compose up --wait agent-runner
      - name: Verify runner readiness and isolation reporting
        run: |
          docker compose exec -T agent-runner curl -fsS http://127.0.0.1:8001/ready | grep '\"ready\":true'
          docker compose exec -T agent-runner python -c "from app.runner import isolation_status; result=isolation_status(); assert 'ready' in result and 'reason' in result"
