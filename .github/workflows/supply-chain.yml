name: Supply chain

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/supply-chain.yml"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  server-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish
        uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ghcr.io/abdullahalrifat/ai-stack-server:${{ github.ref_name }}
          outputs: type=docker
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/abdullahalrifat/ai-stack-server:${{ github.ref_name }}
          format: spdx-json
          output-file: server-image.spdx.json
      - uses: actions/attest-build-provenance@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: server-image.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: server-image-sbom
          path: server-image.spdx.json
