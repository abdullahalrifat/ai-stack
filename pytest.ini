[pytest]
testpaths =
    agents/tests
    cli/tests
pythonpath =
    agents
    cli
cache_dir = /tmp/ai-stack-pytest-cache
# Keep `pytest` usable from an IDE or host checkout without requiring optional
# coverage tooling. Request coverage explicitly in each package's CI job:
# pytest --cov=app --cov-report=term-missing
addopts = --strict-markers
