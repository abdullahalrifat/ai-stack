model_list:

  ###########################################################
  # Embedding Model — stays local to AI Stack
  ###########################################################

  - model_name: nomic-embed-text
    litellm_params:
      model: ollama_embeddings/nomic-embed-text
      api_base: http://ollama:11434
      num_ctx: 8192
    model_info:
      supports_function_calling: false

  ###########################################################
  # Generation models — served by the dedicated jarvis-inference VM
  ###########################################################

  - model_name: qwen3:1.7b
    litellm_params:
      model: openai/qwen3:1.7b
      api_base: os.environ/INFERENCE_BASE_URL
      api_key: os.environ/INFERENCE_API_KEY
      num_ctx: 8192
    model_info:
      supports_function_calling: true

  - model_name: qwen3:4b
    litellm_params:
      model: openai/qwen3:4b
      api_base: os.environ/INFERENCE_BASE_URL
      api_key: os.environ/INFERENCE_API_KEY
      num_ctx: 8192
    model_info:
      supports_function_calling: true
