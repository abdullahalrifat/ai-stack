model_list:

  ###########################################################
  # General Chat
  ###########################################################

  - model_name: quick
    litellm_params:
      model: ollama_chat/qwen3:4b-instruct
      api_base: http://ollama:11434
    model_info:
      supports_function_calling: true

  - model_name: qwen3-8b
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: http://ollama:11434
      extra_body:
        think: false

  - model_name: qwen3-14b
    litellm_params:
      model: ollama_chat/qwen3:14b
      api_base: http://ollama:11434

  ###########################################################
  # Coding
  ###########################################################

  - model_name: coder
    litellm_params:
      # Lightweight compatibility alias for coding-profile requests. The
      # dedicated 30B coder model is intentionally not kept on this host.
      model: ollama_chat/qwen3:8b
      api_base: http://ollama:11434
      extra_body:
        think: false
    model_info:
      supports_function_calling: true

  ###########################################################
  # Reasoning
  ###########################################################

  - model_name: reasoning
    litellm_params:
      model: ollama_chat/deepseek-r1:14b
      api_base: http://ollama:11434

  ###########################################################
  # Vision
  ###########################################################

  - model_name: vision
    litellm_params:
      model: ollama_chat/gemma3:12b
      api_base: http://ollama:11434

  ###########################################################
  # Embedding
  ###########################################################

  - model_name: embedding
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434

###########################################################
# General Settings
###########################################################

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

###########################################################
# LiteLLM Settings
###########################################################

litellm_settings:
  set_verbose: true
  drop_params: true
  callbacks:
    - direct_client_guard.proxy_handler_instance

###########################################################
# Router Settings
###########################################################

router_settings:
  routing_strategy: simple-shuffle
