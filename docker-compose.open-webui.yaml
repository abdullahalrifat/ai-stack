# Optional Open WebUI service. This service is intentionally excluded from the default deployment.
# Start it after the core stack with:
# docker compose -f docker-compose.yaml -f docker-compose.open-webui.yaml up -d open-webui
# Stop only the UI with:
# docker compose -f docker-compose.yaml -f docker-compose.open-webui.yaml stop open-webui
# Persistent data is preserved in ./open-webui.

services:

  ####################################################
  ## Open WebUI (disabled backup)
  ####################################################
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      pipelines:
        condition: service_started
      server:
        condition: service_healthy

    ports:
      - "3003:8080"

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ai_stack
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:6333
      OPENAI_API_BASE_URL: ${INFERENCE_BASE_URL}
      OPENAI_API_BASE_URLS: ${INFERENCE_BASE_URL}
      OPENAI_API_KEYS: ${INFERENCE_API_KEY:-}

    volumes:
      - ./open-webui:/app/backend/data

    networks:
      - ai
      - proxy
