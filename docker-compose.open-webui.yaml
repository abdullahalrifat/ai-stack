# Optional Open WebUI deployment.
#
# The default `docker compose up -d` deliberately does not start Open WebUI
# or its Pipelines service. Start this override only when you want the UI:
#   docker compose -f docker-compose.yaml -f docker-compose.open-webui.yaml up -d
#
# Existing Open WebUI data remains in ./open-webui; Pipelines configuration
# remains in ./pipelines. Core AI Stack services are defined in the base file.

services:

  ####################################################
  ## Open WebUI Pipelines (only used by Open WebUI)
  ####################################################
  pipelines:
    image: ghcr.io/open-webui/pipelines:0.12.0
    container_name: pipelines
    restart: unless-stopped

    environment:
      PIPELINES_API_KEY: ${PIPELINES_API_KEY}

    volumes:
      - ./pipelines:/app/pipelines

    networks:
      - ai

  ####################################################
  ## Open WebUI
  ####################################################
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      pipelines:
        condition: service_started
      server:
        condition: service_healthy

    ports:
      - "3003:8080"

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ai_stack
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:6333
      OPENAI_API_BASE_URL: ${INFERENCE_BASE_URL}
      OPENAI_API_BASE_URLS: ${INFERENCE_BASE_URL}
      OPENAI_API_KEYS: ${INFERENCE_API_KEY:-}

    volumes:
      - ./open-webui:/app/backend/data

    networks:
      - ai
      - proxy
