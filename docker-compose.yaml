services:

  ####################################################
  ## Ollama
  ####################################################
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped

    ports:
      - "127.0.0.1:11434:11434"

    environment:
      OLLAMA_KEEP_ALIVE: 24h

    volumes:
      - ./ollama:/root/.ollama

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10

    networks:
      - ai

  ####################################################
  ## PostgreSQL
  ####################################################
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./postgres:/var/lib/postgresql/data

    networks:
      - ai

  ####################################################
  ## Redis
  ####################################################
  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped

    volumes:
      - ./redis:/data

    networks:
      - ai

  ####################################################
  ## Qdrant
  ####################################################
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped

    ports:
      - "127.0.0.1:6333:6333"

    volumes:
      - ./qdrant:/qdrant/storage

    networks:
      - ai

  ####################################################
  ## Private web-search metasearch service
  ####################################################
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped

    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_PORT: 8080
      SEARXNG_BIND_ADDRESS: 0.0.0.0

    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/data:/var/cache/searxng

    networks:
      - ai

  ####################################################
  ## LiteLLM
  ####################################################
  litellm:
    image: custom-litellm:latest
    container_name: litellm
    restart: unless-stopped

    entrypoint: ["litellm"]

    command:
      - "--config=/app/config.yaml"
      - "--host=0.0.0.0"
      - "--port=4000"

    ports:
      - "127.0.0.1:4000:4000"

    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}

    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro

    depends_on:
      ollama:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket;s=socket.socket();s.connect(('127.0.0.1',4000));print('ok')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - ai

  ####################################################
  ## Pipelines
  ####################################################
  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    container_name: pipelines
    restart: unless-stopped

    ports:
      - "127.0.0.1:9099:9099"

    environment:
      PIPELINES_API_KEY: ${PIPELINES_API_KEY}

    volumes:
      - ./pipelines:/app/pipelines

    networks:
      - ai

  ####################################################
  ## Open WebUI
  ####################################################
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: unless-stopped

    depends_on:
      ollama:
        condition: service_healthy
      litellm:
        condition: service_healthy
      postgres:
        condition: service_started
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      pipelines:
        condition: service_started
      agents:
        condition: service_healthy

    ports:
      - "3000:8080"

    environment:
      OLLAMA_BASE_URL: http://ollama:11434

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      REDIS_URL: redis://redis:6379

      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:6333

      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_BASE_URLS: http://litellm:4000/v1;http://agents:8000/v1
      OPENAI_API_KEYS: ${LITELLM_MASTER_KEY};${AGENT_API_KEY}
      OPENAI_API_CONFIGS: '{"1":{"prefix_id":"agent/","model_ids":["coding-agent"]}}'

    volumes:
      - ./open-webui:/app/backend/data

    networks:
      - ai

  ####################################################
  ## AI Agents
  ####################################################
  agents:
    image: ai-agents:latest
    container_name: ai-agents
    restart: unless-stopped

    working_dir: /app

    volumes:
      - ${WORKSPACE_PATH:-/mnt/work/code}:/workspace

    environment:
      OPENAI_API_BASE: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}

      AGENT_API_KEY: ${AGENT_API_KEY}

      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
      WORKSPACE_DIR: /workspace
      MAX_AGENT_STEPS: ${MAX_AGENT_STEPS:-12}
      COMMAND_TIMEOUT_SECONDS: ${COMMAND_TIMEOUT_SECONDS:-120}
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-true}
      WEB_SEARCH_URL: http://searxng:8080/search

    ports:
      - "127.0.0.1:8000:8000"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 256

    depends_on:
      litellm:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
      searxng:
        condition: service_started

    networks:
      - ai

networks:
  ai:
    driver: bridge
