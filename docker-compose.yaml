services:

  ####################################################
  ## Ollama
  ####################################################
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped

    ports:
      - "127.0.0.1:11434:11434"

    environment:
      # Retain the router, active executor, and embedding model together to
      # avoid reloading weights between phases of one request.
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-3}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      # Open WebUI can attach several tool schemas to one request. 4096 is
      # too small for those prompts. 32768 matches the num_ctx each model
      # advertises through LiteLLM; lower it on memory-constrained hosts.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-32768}

    volumes:
      - ./ollama:/root/.ollama

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10

    networks:
      - ai

  ####################################################
  ## PostgreSQL
  ####################################################
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - ai

  ####################################################
  ## Redis
  ####################################################
  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped

    volumes:
      - ./redis:/data

    networks:
      - ai

  ####################################################
  ## Qdrant
  ####################################################
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped

    ports:
      - "127.0.0.1:6333:6333"

    volumes:
      - ./qdrant:/qdrant/storage

    networks:
      - ai

  ####################################################
  ## Private web-search metasearch service
  ####################################################
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped

    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_PORT: 8080
      SEARXNG_BIND_ADDRESS: 0.0.0.0

    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/data:/var/cache/searxng

    networks:
      - ai

  ####################################################
  ## LiteLLM
  ####################################################
  litellm:
    build: ./litellm
    image: custom-litellm:latest
    container_name: litellm
    restart: unless-stopped

    command:
      - "--host=0.0.0.0"
      - "--port=4000"

    ports:
      - "127.0.0.1:4000:4000"

    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # Optional remote providers. They are activated only when every variable
      # for that provider is configured.
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HF_MODEL: ${HF_MODEL:-}
      HF_INFERENCE_BASE_URL: ${HF_INFERENCE_BASE_URL:-}
      HF_API_KEY: ${HF_API_KEY:-}

    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro

    depends_on:
      ollama:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket;s=socket.socket();s.connect(('127.0.0.1',4000));print('ok')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - ai

  ####################################################
  ## Pipelines
  ####################################################
  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    container_name: pipelines
    restart: unless-stopped

    ports:
      - "127.0.0.1:9099:9099"

    environment:
      PIPELINES_API_KEY: ${PIPELINES_API_KEY}

    volumes:
      - ./pipelines:/app/pipelines

    networks:
      - ai

  ####################################################
  ## Open WebUI
  ####################################################
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: unless-stopped

    depends_on:
      ollama:
        condition: service_healthy
      litellm:
        condition: service_healthy
      postgres:
        condition: service_started
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      pipelines:
        condition: service_started
      server:
        condition: service_healthy

    ports:
      - "127.0.0.1:3000:8080"

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:6333

      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_BASE_URLS: http://litellm:4000/v1;http://server:8000/v1
      # Keys correspond positionally to OPENAI_API_BASE_URLS.  The agent
      # endpoint has its own key; leaving this blank makes the seeded
      # connection unusable.
      OPENAI_API_KEYS: ${LITELLM_MASTER_KEY};${AGENT_API_KEY}
      # Open WebUI joins an OpenAI connection prefix with a dot, producing
      # the displayed model id "agent.orchestrator".
      OPENAI_API_CONFIGS: '{"1":{"prefix_id":"agent","model_ids":["orchestrator"]}}'

    volumes:
      - ./open-webui:/app/backend/data

    networks:
      - ai

  ####################################################
  ## AI Agents
  ####################################################
  server:
    build: ./server
    image: ai-stack-server:latest
    container_name: ai-stack-server
    restart: unless-stopped

    working_dir: /app

    volumes:
      # Primary workspace. To let the agent see additional repositories,
      # mount them elsewhere (e.g. ./more-code:/extra-workspace) and list
      # the in-container path in WORKSPACE_ROOTS below.
      - ${WORKSPACE_PATH:-/mnt/work/code}:/workspace
      # Persists disposable Git clones used for edit-enabled /runs
      # requests across container restarts, so a run awaiting approval
      # survives a restart of the agent service.
      - ./agent-sandboxes:/sandboxes

    environment:
      OPENAI_API_BASE: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}

      AGENT_API_KEY: ${AGENT_API_KEY}
      # Authentication is mandatory unless explicitly disabled for isolated
      # local development. Never enable this on a reachable host.
      ALLOW_INSECURE_NO_AUTH: ${ALLOW_INSECURE_NO_AUTH:-false}
      RUNNER_API_KEY: ${RUNNER_API_KEY:-${AGENT_API_KEY}}
      RUNNER_URL: ${RUNNER_URL:-http://agent-runner:8001}

      # DEFAULT_MODEL is what /chat, /execute, and /runs use unless a request
      # overrides it. AGENT_MODEL_ID is the id the agent advertises at
      # /v1/models and is what Open WebUI's "agent.orchestrator" connection
      # expects to see -- keep it in sync with the model_ids entry in
      # open-webui's OPENAI_API_CONFIGS above if you change it.
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen3-8b}
      # Fast CPU-mode model used for ordinary Auto / Quick chat requests.
      FAST_MODEL: ${FAST_MODEL:-quick}
      # Semantic routing is a short JSON-only turn before Auto execution.
      ROUTER_MODEL: ${ROUTER_MODEL:-quick}
      ROUTER_ESCALATION_MODEL: ${ROUTER_ESCALATION_MODEL:-coder}
      ROUTER_MAX_COMPLETION_TOKENS: ${ROUTER_MAX_COMPLETION_TOKENS:-1536}
      ROUTER_TIMEOUT_SECONDS: ${ROUTER_TIMEOUT_SECONDS:-240}
      ROUTER_ESCALATION_TIMEOUT_SECONDS: ${ROUTER_ESCALATION_TIMEOUT_SECONDS:-480}
      # Financial evidence synthesis stays on the more capable 8B alias.
      FINANCE_MODEL: ${FINANCE_MODEL:-coder}
      # Used for current web/financial research through agent.orchestrator.
      RESEARCH_MODEL: ${RESEARCH_MODEL:-quick}
      AGENT_MODEL_ID: ${AGENT_MODEL_ID:-orchestrator}

      QDRANT_URL: http://qdrant:6333
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

      # Required for the durable, streamed /runs API (SSE progress, sandbox
      # diff approval). /chat and /execute work without this.
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}

      WORKSPACE_DIR: ${WORKSPACE_DIR:-/workspace}
      # New requests default to this repository instead of scanning the whole
      # parent bind mount. It must be inside WORKSPACE_DIR or WORKSPACE_ROOTS.
      DEFAULT_WORKSPACE_DIR: ${DEFAULT_WORKSPACE_DIR:-/workspace}
      # Comma-separated list of additional directories the agent may be
      # pointed at via the `workspace` request field, beyond WORKSPACE_DIR.
      WORKSPACE_ROOTS: ${WORKSPACE_ROOTS:-}

      SANDBOX_ROOT: ${SANDBOX_ROOT:-/sandboxes}

      MAX_AGENT_STEPS: ${MAX_AGENT_STEPS:-80}
      MAX_EMPTY_MODEL_TURNS: ${MAX_EMPTY_MODEL_TURNS:-5}
      MAX_EMPTY_SEARCH_RESULTS: ${MAX_EMPTY_SEARCH_RESULTS:-5}
      MAX_UNPRODUCTIVE_TOOL_CALLS: ${MAX_UNPRODUCTIVE_TOOL_CALLS:-5}
      # One local CPU/GPU inference worker by default; concurrent requests
      # queue instead of competing for Ollama and appearing stalled.
      MAX_CONCURRENT_AGENT_RUNS: ${MAX_CONCURRENT_AGENT_RUNS:-2}
      MAX_CONCURRENT_LLM_CALLS: ${MAX_CONCURRENT_LLM_CALLS:-1}
      MAX_TOOL_OUTPUT_CHARS: ${MAX_TOOL_OUTPUT_CHARS:-16000}
      # A cold local 8B model can spend ~40s loading and ~60s ingesting a
      # repository/tool prompt before its first streamed token, and a
      # thinking-enabled 8B turn can run ~2.5-3min at CPU inference speed.
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-600}
      LLM_MAX_COMPLETION_TOKENS: ${LLM_MAX_COMPLETION_TOKENS:-3072}
      ANALYSIS_SYNTHESIS_MODEL: ${ANALYSIS_SYNTHESIS_MODEL:-qwen3-14b}
      ANALYSIS_SYNTHESIS_MAX_TOKENS: ${ANALYSIS_SYNTHESIS_MAX_TOKENS:-2048}
      ANALYSIS_SYNTHESIS_TIMEOUT_SECONDS: ${ANALYSIS_SYNTHESIS_TIMEOUT_SECONDS:-600}
      # Escalate only after a bounded failure loop, then independently review
      # high-risk diffs before exposing them for approval.
      AGENT_REASONING_MODEL: ${AGENT_REASONING_MODEL:-qwen3-14b}
      AGENT_MODEL_ESCALATIONS: ${AGENT_MODEL_ESCALATIONS:-3}
      CHANGE_REVIEW_MODEL: ${CHANGE_REVIEW_MODEL:-reasoning}
      CHANGE_REVIEW_MODEL_ENABLED: ${CHANGE_REVIEW_MODEL_ENABLED:-true}
      # Multi-expert dispatch for complex auto-routed requests: bounded expert
      # analyses run in parallel before the tool loop and feed the evidence
      # ledger. Concurrency stays bounded by MAX_CONCURRENT_LLM_CALLS.
      EXPERT_DISPATCH_ENABLED: ${EXPERT_DISPATCH_ENABLED:-true}
      EXPERT_DISPATCH_MODEL: ${EXPERT_DISPATCH_MODEL:-qwen3-14b}
      MAX_PARALLEL_EXPERTS: ${MAX_PARALLEL_EXPERTS:-4}
      EXPERT_MAX_COMPLETION_TOKENS: ${EXPERT_MAX_COMPLETION_TOKENS:-1024}
      EXPERT_DISPATCH_TIMEOUT_SECONDS: ${EXPERT_DISPATCH_TIMEOUT_SECONDS:-600}
      EXPERT_FINDINGS_CONTEXT_CHARS: ${EXPERT_FINDINGS_CONTEXT_CHARS:-2400}
      PLANNER_MAX_COMPLETION_TOKENS: ${PLANNER_MAX_COMPLETION_TOKENS:-384}
      # Bound Open WebUI/Continue input before the agent adds tools and its
      # own instructions, preventing an 8K Ollama context overflow.
      OPENAI_INPUT_MAX_CHARS: ${OPENAI_INPUT_MAX_CHARS:-16000}
      CONTEXT_TOKEN_LIMIT: ${CONTEXT_TOKEN_LIMIT:-32768}
      CONTEXT_OUTPUT_RESERVE_TOKENS: ${CONTEXT_OUTPUT_RESERVE_TOKENS:-4096}
      FINANCE_MAX_COMPLETION_TOKENS: ${FINANCE_MAX_COMPLETION_TOKENS:-1536}
      FINANCE_LLM_TIMEOUT_SECONDS: ${FINANCE_LLM_TIMEOUT_SECONDS:-600}
      COMMAND_TIMEOUT_SECONDS: ${COMMAND_TIMEOUT_SECONDS:-300}
      RUNNER_JOB_LEASE_SECONDS: ${RUNNER_JOB_LEASE_SECONDS:-10}
      # Every tunable below defaults to the same value as config.py so the
      # deployed stack can be maintained entirely from .env (see .env.example).
      MAX_PARALLEL_TOOL_CALLS: ${MAX_PARALLEL_TOOL_CALLS:-6}
      TOOL_RESULT_SUMMARY_CHARS: ${TOOL_RESULT_SUMMARY_CHARS:-6000}
      TOOL_RESULT_SUMMARY_ITEMS: ${TOOL_RESULT_SUMMARY_ITEMS:-6}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_RETRY_BACKOFF_SECONDS: ${LLM_RETRY_BACKOFF_SECONDS:-2}
      REPLAN_MAX_COMPLETION_TOKENS: ${REPLAN_MAX_COMPLETION_TOKENS:-512}
      REPLAN_FAIL_STREAK: ${REPLAN_FAIL_STREAK:-5}
      REPLAN_STUCK_STEPS: ${REPLAN_STUCK_STEPS:-12}
      REPLAN_MAX_RETRIES: ${REPLAN_MAX_RETRIES:-3}
      RUN_WORKER_LEASE_SECONDS: ${RUN_WORKER_LEASE_SECONDS:-60}
      WEB_SEARCH_URL: ${WEB_SEARCH_URL:-http://searxng:8080/search}
      WEB_SEARCH_TIMEOUT_SECONDS: ${WEB_SEARCH_TIMEOUT_SECONDS:-15}
      # Retained for backwards compatibility; no longer the compaction trigger.
      CONTEXT_COMPACT_EVERY_STEPS: ${CONTEXT_COMPACT_EVERY_STEPS:-6}
      CONTEXT_COMPACT_KEEP_RECENT: ${CONTEXT_COMPACT_KEEP_RECENT:-4}

      # Executables the run_command tool may invoke (no shell metacharacters
      # are permitted regardless of this list).
      ALLOWED_COMMANDS: ${ALLOWED_COMMANDS:-git,ls,cat,pytest,python,python3,npm,node,make,grep,find,mypy,ruff,black,flake8}

      # Tier 2 scoped permissions. EDIT_ALLOWED_PATHS narrows write tools to
      # these workspace-relative directories (comma-separated); empty means a
      # full-write scope when write permission is granted. COMMAND_ALLOWLIST
      # optionally narrows ALLOWED_COMMANDS further for write-capable runs.
      # RUN_COMMANDS_ALLOW_NETWORK moves command execution to the runner's
      # "network" tier; off by default so commands stay on the internal network.
      EDIT_ALLOWED_PATHS: ${EDIT_ALLOWED_PATHS:-}
      COMMAND_ALLOWLIST: ${COMMAND_ALLOWLIST:-}
      RUN_COMMANDS_ALLOW_NETWORK: ${RUN_COMMANDS_ALLOW_NETWORK:-false}

      CONTEXT_COMPACT_THRESHOLD_TOKENS: ${CONTEXT_COMPACT_THRESHOLD_TOKENS:-24000}
      MEMORY_ENABLED: ${MEMORY_ENABLED:-true}
      MEMORY_FOR_CODE_RUNS: ${MEMORY_FOR_CODE_RUNS:-false}
      GENERATED_MEMORY_ENABLED: ${GENERATED_MEMORY_ENABLED:-false}
      OLLAMA_EMBED_MAX_CHARS: ${OLLAMA_EMBED_MAX_CHARS:-6000}
      MEMORY_CONTEXT_TOKENS: ${MEMORY_CONTEXT_TOKENS:-2400}
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-10000000}
      MODEL_LIST_CACHE_SECONDS: ${MODEL_LIST_CACHE_SECONDS:-300}
      RUNNER_CPU_SECONDS: ${RUNNER_CPU_SECONDS:-300}
      RUNNER_MEMORY_MB: ${RUNNER_MEMORY_MB:-4096}
      RUNNER_MAX_OPEN_FILES: ${RUNNER_MAX_OPEN_FILES:-256}
      RUN_EVENT_BATCH_CHARS: ${RUN_EVENT_BATCH_CHARS:-2048}
      RUN_EVENT_BATCH_SECONDS: ${RUN_EVENT_BATCH_SECONDS:-0.50}

      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-true}
      # 8 MB accommodates typical audited annual-report PDFs. Lower this on
      # constrained networks or raise it for unusually large filings.
      WEB_FETCH_MAX_BYTES: ${WEB_FETCH_MAX_BYTES:-8000000}

      # Optional Automatic1111/Forge-compatible local image generator.
      IMAGE_GENERATION_URL: ${IMAGE_GENERATION_URL:-}
      IMAGE_GENERATION_TIMEOUT_SECONDS: ${IMAGE_GENERATION_TIMEOUT_SECONDS:-180}

    ports:
      - "127.0.0.1:8000:8000"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
    # The server container merges approved sandbox diffs directly into the
    # host bind-mounted workspace, which is owned by the host user's UID.
    # Without DAC_OVERRIDE the root process cannot write into those 775
    # subdirectories and approvals fail to land.
    cap_add:
      - DAC_OVERRIDE

    pids_limit: 256
    mem_limit: ${AGENT_MEMORY_LIMIT:-8g}
    cpus: ${AGENT_CPUS:-4}

    depends_on:
      agent-runner:
        condition: service_started
      litellm:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
      searxng:
        condition: service_started

    networks:
      - ai
      - runner

  agent-runner:
    image: ai-stack-server:latest
    container_name: agent-runner
    restart: unless-stopped
    command: ["uvicorn", "app.runner:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      RUNNER_API_KEY: ${RUNNER_API_KEY:-${AGENT_API_KEY}}
      SANDBOX_ROOT: ${SANDBOX_ROOT:-/sandboxes}
      COMMAND_TIMEOUT_SECONDS: ${COMMAND_TIMEOUT_SECONDS:-300}
      RUNNER_CPU_SECONDS: ${RUNNER_CPU_SECONDS:-300}
      RUNNER_MEMORY_MB: ${RUNNER_MEMORY_MB:-4096}
      RUNNER_MAX_OPEN_FILES: ${RUNNER_MAX_OPEN_FILES:-256}
      # Wrap "isolated"-tier commands in a private network namespace when the
      # host's unshare supports it (cap_drop: ALL means it is normally
      # unavailable here; the internal "runner" network stays the boundary).
      RUNNER_ENABLE_NETNS: ${RUNNER_ENABLE_NETNS:-true}
      ALLOWED_COMMANDS: ${ALLOWED_COMMANDS:-git,pytest,python,python3,npm,node,make,mypy,ruff,black,flake8}
    volumes:
      - ./agent-sandboxes:/sandboxes
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: ${RUNNER_MEMORY_LIMIT:-3g}
    cpus: ${RUNNER_CPUS:-2}
    networks:
      - runner

  ####################################################
  ## Runs UI -- React/TypeScript coding task console
  ####################################################
  runs-ui:
    build: ./runs-ui
    image: ai-runs-ui:latest
    container_name: ai-runs-ui
    restart: unless-stopped

    depends_on:
      server:
        condition: service_healthy

    ports:
      - "127.0.0.1:3001:8080"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

    networks:
      - ai

networks:
  ai:
    driver: bridge
  runner:
    internal: true
