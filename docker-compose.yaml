services:

  ####################################################
  ## Ollama
  ####################################################
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped

    ports:
      - "127.0.0.1:11434:11434"

    environment:
      OLLAMA_KEEP_ALIVE: 24h

    volumes:
      - ./ollama:/root/.ollama

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10

    networks:
      - ai

  ####################################################
  ## PostgreSQL
  ####################################################
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - ai

  ####################################################
  ## Redis
  ####################################################
  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped

    volumes:
      - ./redis:/data

    networks:
      - ai

  ####################################################
  ## Qdrant
  ####################################################
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped

    ports:
      - "127.0.0.1:6333:6333"

    volumes:
      - ./qdrant:/qdrant/storage

    networks:
      - ai

  ####################################################
  ## Private web-search metasearch service
  ####################################################
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped

    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_PORT: 8080
      SEARXNG_BIND_ADDRESS: 0.0.0.0

    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/data:/var/cache/searxng

    networks:
      - ai

  ####################################################
  ## LiteLLM
  ####################################################
  litellm:
    image: custom-litellm:latest
    container_name: litellm
    restart: unless-stopped

    entrypoint: ["litellm"]

    command:
      - "--config=/app/config.yaml"
      - "--host=0.0.0.0"
      - "--port=4000"

    ports:
      - "127.0.0.1:4000:4000"

    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}

    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro

    depends_on:
      ollama:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket;s=socket.socket();s.connect(('127.0.0.1',4000));print('ok')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - ai

  ####################################################
  ## Pipelines
  ####################################################
  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    container_name: pipelines
    restart: unless-stopped

    ports:
      - "127.0.0.1:9099:9099"

    environment:
      PIPELINES_API_KEY: ${PIPELINES_API_KEY}

    volumes:
      - ./pipelines:/app/pipelines

    networks:
      - ai

  ####################################################
  ## Open WebUI
  ####################################################
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: unless-stopped

    depends_on:
      ollama:
        condition: service_healthy
      litellm:
        condition: service_healthy
      postgres:
        condition: service_started
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      pipelines:
        condition: service_started
      agents:
        condition: service_healthy

    ports:
      - "127.0.0.1:3000:8080"

    environment:
      OLLAMA_BASE_URL: http://ollama:11434

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      REDIS_URL: redis://redis:6379

      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:6333

      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_BASE_URLS: http://litellm:4000/v1;http://agents:8000/v1
      # Keys correspond positionally to OPENAI_API_BASE_URLS.  The agent
      # endpoint has its own key; leaving this blank makes the seeded
      # connection unusable.
      OPENAI_API_KEYS: ${LITELLM_MASTER_KEY};${AGENT_API_KEY}
      # Open WebUI joins an OpenAI connection prefix with a dot, producing
      # the displayed model id "agent.coding-agent".
      OPENAI_API_CONFIGS: '{"1":{"prefix_id":"agent","model_ids":["coding-agent","auto","code","research","finance","deep","vision"]}}'

    volumes:
      - ./open-webui:/app/backend/data

    networks:
      - ai

  ####################################################
  ## AI Agents
  ####################################################
  agents:
    image: ai-agents:latest
    container_name: ai-agents
    restart: unless-stopped

    working_dir: /app

    volumes:
      # Primary workspace. To let the agent see additional repositories,
      # mount them elsewhere (e.g. ./more-code:/extra-workspace) and list
      # the in-container path in WORKSPACE_ROOTS below.
      - ${WORKSPACE_PATH:-/mnt/work/code}:/workspace
      # Persists disposable Git worktrees used for write-enabled /runs
      # requests across container restarts, so a run awaiting approval
      # survives a restart of the agent service.
      - ./agent-sandboxes:/sandboxes

    environment:
      OPENAI_API_BASE: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}

      AGENT_API_KEY: ${AGENT_API_KEY}

      # DEFAULT_MODEL is what /chat, /execute, and /runs use unless a request
      # overrides it. AGENT_MODEL_ID is the id the agent advertises at
      # /v1/models and is what Open WebUI's "agent.coding-agent" connection
      # expects to see -- keep it in sync with the model_ids entry in
      # open-webui's OPENAI_API_CONFIGS above if you change it.
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen3-8b}
      # Used for current web/financial research through agent.coding-agent.
      RESEARCH_MODEL: ${RESEARCH_MODEL:-qwen3-8b}
      AGENT_MODEL_ID: ${AGENT_MODEL_ID:-coding-agent}

      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379

      # Required for the durable, streamed /runs API (SSE progress, sandbox
      # diff approval). /chat and /execute work without this.
      POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      WORKSPACE_DIR: /workspace
      # Comma-separated list of additional directories the agent may be
      # pointed at via the `workspace` request field, beyond WORKSPACE_DIR.
      WORKSPACE_ROOTS: ${WORKSPACE_ROOTS:-}

      SANDBOX_ROOT: /sandboxes

      MAX_AGENT_STEPS: ${MAX_AGENT_STEPS:-12}
      MAX_TOOL_OUTPUT_CHARS: ${MAX_TOOL_OUTPUT_CHARS:-8000}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      LLM_MAX_COMPLETION_TOKENS: ${LLM_MAX_COMPLETION_TOKENS:-384}
      COMMAND_TIMEOUT_SECONDS: ${COMMAND_TIMEOUT_SECONDS:-120}

      # Executables the run_command tool may invoke (no shell metacharacters
      # are permitted regardless of this list).
      ALLOWED_COMMANDS: ${ALLOWED_COMMANDS:-git,ls,cat,pytest,python,python3,npm,node,make,grep,find,mypy,ruff,black,flake8}

      CONTEXT_COMPACT_EVERY_STEPS: ${CONTEXT_COMPACT_EVERY_STEPS:-6}
      MODEL_LIST_CACHE_SECONDS: ${MODEL_LIST_CACHE_SECONDS:-300}
      RUNNER_CPU_SECONDS: ${RUNNER_CPU_SECONDS:-90}
      RUNNER_MEMORY_MB: ${RUNNER_MEMORY_MB:-2048}
      RUNNER_MAX_OPEN_FILES: ${RUNNER_MAX_OPEN_FILES:-256}
      RUN_EVENT_BATCH_CHARS: ${RUN_EVENT_BATCH_CHARS:-256}
      RUN_EVENT_BATCH_SECONDS: ${RUN_EVENT_BATCH_SECONDS:-0.10}

      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-true}
      WEB_SEARCH_URL: http://searxng:8080/search

      # Optional Automatic1111/Forge-compatible local image generator.
      IMAGE_GENERATION_URL: ${IMAGE_GENERATION_URL:-}
      IMAGE_GENERATION_TIMEOUT_SECONDS: ${IMAGE_GENERATION_TIMEOUT_SECONDS:-180}

    ports:
      - "127.0.0.1:8000:8000"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 256
    mem_limit: ${AGENT_MEMORY_LIMIT:-4g}
    cpus: ${AGENT_CPUS:-4}

    depends_on:
      litellm:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
      searxng:
        condition: service_started

    networks:
      - ai

  ####################################################
  ## Runs UI -- React/TypeScript coding task console
  ####################################################
  runs-ui:
    build: ./runs-ui
    image: ai-runs-ui:latest
    container_name: ai-runs-ui
    restart: unless-stopped

    depends_on:
      agents:
        condition: service_healthy

    ports:
      - "127.0.0.1:3001:8080"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

    networks:
      - ai

networks:
  ai:
    driver: bridge
