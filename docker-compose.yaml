services:

  ####################################################
  ## PostgreSQL
  ####################################################
  postgres:
    image: postgres:17.11
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - ai

  ####################################################
  ## Redis
  ####################################################
  redis:
    image: redis:8.10.2-alpine
    container_name: redis
    restart: unless-stopped

    volumes:
      - ./redis:/data

    networks:
      - ai

  ####################################################
  ## Qdrant
  ####################################################
  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: qdrant
    restart: unless-stopped

    volumes:
      - ./qdrant:/qdrant/storage

    networks:
      - ai

  ####################################################
  ## Private web-search metasearch service
  ####################################################
  searxng:
    image: ghcr.io/searxng/searxng:2026.10.4-d48c4b555@sha256:b0497f6e93b5e98b1a15c66b333afed176266af34f479a46ed87514f4a441eda
    container_name: searxng
    restart: unless-stopped

    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_PORT: 8080
      SEARXNG_BIND_ADDRESS: 0.0.0.0

    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/data:/var/cache/searxng

    networks:
      - ai

  ####################################################
  ## AI Agents
  ####################################################
  server:
    build: ./server
    image: ai-stack-server:latest
    container_name: ai-stack-server
    restart: unless-stopped

    working_dir: /app

    volumes:
      # Primary workspace. To let the agent see additional repositories,
      # mount them elsewhere (e.g. ./more-code:/extra-workspace) and list
      # the in-container path in WORKSPACE_ROOTS below.
      - ${WORKSPACE_PATH:-/mnt/work/code}:/workspace
      # Persists disposable Git clones used for edit-enabled /runs
      # requests across container restarts, so a run awaiting approval
      # survives a restart of the agent service.
      - ./agent-sandboxes:/sandboxes

    environment:
      OPENAI_API_BASE: ${INFERENCE_BASE_URL}
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      OPENAI_API_KEY: ${INFERENCE_API_KEY:-}

      AGENT_API_KEY: ${AGENT_API_KEY}
      # Authentication is mandatory unless explicitly disabled for isolated
      # local development. Never enable this on a reachable host.
      ALLOW_INSECURE_NO_AUTH: ${ALLOW_INSECURE_NO_AUTH:-false}
      RUNNER_API_KEY: ${RUNNER_API_KEY:-${AGENT_API_KEY}}
      RUNNER_URL: ${RUNNER_URL:-http://agent-runner:8001}

      # DEFAULT_MODEL is the concrete model used by /chat, /execute, and /runs.
      # Open WebUI uses the same concrete model id for the server-side agent.
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen3:1.7b}
      # Fast CPU-mode model used for ordinary Auto / Quick chat requests.
      FAST_MODEL: ${FAST_MODEL:-qwen3:1.7b}
      # Semantic routing is a short JSON-only turn before Auto execution.
      ROUTER_MODEL: ${ROUTER_MODEL:-qwen3:1.7b}
      ROUTER_MAX_COMPLETION_TOKENS: ${ROUTER_MAX_COMPLETION_TOKENS:-768}
      ROUTER_TIMEOUT_SECONDS: ${ROUTER_TIMEOUT_SECONDS:-180}
      FINANCE_MODEL: ${FINANCE_MODEL:-qwen3:4b}
      # Used for current web/financial research.
      RESEARCH_MODEL: ${RESEARCH_MODEL:-qwen3:1.7b}
      RESEARCH_TIMEOUT_SECONDS: ${RESEARCH_TIMEOUT_SECONDS:-300}

      QDRANT_URL: http://qdrant:6333
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

      # Required for the durable, streamed /runs API (SSE progress, sandbox
      # diff approval). /chat and /execute work without this.
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://ai_stack:${POSTGRES_PASSWORD:-change-this-to-a-long-random-password}@postgres:5432/ai_stack}

      WORKSPACE_DIR: ${WORKSPACE_DIR:-/workspace}
      # New requests default to this repository instead of scanning the whole
      # parent bind mount. It must be inside WORKSPACE_DIR or WORKSPACE_ROOTS.
      DEFAULT_WORKSPACE_DIR: ${DEFAULT_WORKSPACE_DIR:-/workspace}
      # Comma-separated list of additional directories the agent may be
      # pointed at via the `workspace` request field, beyond WORKSPACE_DIR.
      WORKSPACE_ROOTS: ${WORKSPACE_ROOTS:-}

      SANDBOX_ROOT: ${SANDBOX_ROOT:-/sandboxes}

      MAX_AGENT_STEPS: ${MAX_AGENT_STEPS:-24}
      TOKEN_RUN_INPUT_LIMIT: ${TOKEN_RUN_INPUT_LIMIT:-48000}
      TOKEN_RUN_OUTPUT_LIMIT: ${TOKEN_RUN_OUTPUT_LIMIT:-8000}
      TOKEN_TURN_INPUT_LIMIT: ${TOKEN_TURN_INPUT_LIMIT:-12000}
      TOKEN_TURN_OUTPUT_LIMIT: ${TOKEN_TURN_OUTPUT_LIMIT:-4096}
      TOKEN_AGENT_INPUT_LIMIT: ${TOKEN_AGENT_INPUT_LIMIT:-32000}
      TOKEN_AGENT_OUTPUT_LIMIT: ${TOKEN_AGENT_OUTPUT_LIMIT:-6000}
      MAX_EMPTY_MODEL_TURNS: ${MAX_EMPTY_MODEL_TURNS:-3}
      MAX_EMPTY_SEARCH_RESULTS: ${MAX_EMPTY_SEARCH_RESULTS:-3}
      MAX_UNPRODUCTIVE_TOOL_CALLS: ${MAX_UNPRODUCTIVE_TOOL_CALLS:-3}
      # One local CPU/GPU inference worker by default; concurrent requests
      # queue instead of competing for Ollama and appearing stalled.
      MAX_CONCURRENT_AGENT_RUNS: ${MAX_CONCURRENT_AGENT_RUNS:-1}
      MAX_CONCURRENT_LLM_CALLS: ${MAX_CONCURRENT_LLM_CALLS:-1}
      MAX_TOOL_OUTPUT_CHARS: ${MAX_TOOL_OUTPUT_CHARS:-8000}
      # Keep the single 4B local model path predictable on CPU-only hosts.
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-480}
      LLM_MAX_COMPLETION_TOKENS: ${LLM_MAX_COMPLETION_TOKENS:-1024}
      ANALYSIS_SYNTHESIS_MODEL: ${ANALYSIS_SYNTHESIS_MODEL:-qwen3:4b}
      ANALYSIS_SYNTHESIS_MAX_TOKENS: ${ANALYSIS_SYNTHESIS_MAX_TOKENS:-1024}
      ANALYSIS_SYNTHESIS_TIMEOUT_SECONDS: ${ANALYSIS_SYNTHESIS_TIMEOUT_SECONDS:-360}
      # Escalate only after a bounded failure loop, then independently review
      # high-risk diffs before exposing them for approval.
      AGENT_REASONING_MODEL: ${AGENT_REASONING_MODEL:-qwen3:4b}
      AGENT_MODEL_ESCALATIONS: ${AGENT_MODEL_ESCALATIONS:-1}
      CHANGE_REVIEW_MODEL: ${CHANGE_REVIEW_MODEL:-qwen3:4b}
      CHANGE_REVIEW_MODEL_ENABLED: ${CHANGE_REVIEW_MODEL_ENABLED:-true}
      # Multi-expert dispatch for complex auto-routed requests: bounded expert
      # analyses run in parallel before the tool loop and feed the evidence
      # ledger. Concurrency stays bounded by MAX_CONCURRENT_LLM_CALLS.
      EXPERT_DISPATCH_ENABLED: ${EXPERT_DISPATCH_ENABLED:-false}
      EXPERT_DISPATCH_MODEL: ${EXPERT_DISPATCH_MODEL:-qwen3:4b}
      MAX_PARALLEL_EXPERTS: ${MAX_PARALLEL_EXPERTS:-1}
      EXPERT_MAX_COMPLETION_TOKENS: ${EXPERT_MAX_COMPLETION_TOKENS:-512}
      EXPERT_DISPATCH_TIMEOUT_SECONDS: ${EXPERT_DISPATCH_TIMEOUT_SECONDS:-600}
      EXPERT_FINDINGS_CONTEXT_CHARS: ${EXPERT_FINDINGS_CONTEXT_CHARS:-1600}
      PLANNER_MAX_COMPLETION_TOKENS: ${PLANNER_MAX_COMPLETION_TOKENS:-256}
      # Bound Open WebUI/Continue input before the agent adds tools and its
      # own instructions, preventing an 8K Ollama context overflow.
      OPENAI_INPUT_MAX_CHARS: ${OPENAI_INPUT_MAX_CHARS:-12000}
      CONTEXT_TOKEN_LIMIT: ${CONTEXT_TOKEN_LIMIT:-8192}
      CONTEXT_OUTPUT_RESERVE_TOKENS: ${CONTEXT_OUTPUT_RESERVE_TOKENS:-1024}
      FINANCE_MAX_COMPLETION_TOKENS: ${FINANCE_MAX_COMPLETION_TOKENS:-1024}
      FINANCE_LLM_TIMEOUT_SECONDS: ${FINANCE_LLM_TIMEOUT_SECONDS:-360}
      COMMAND_TIMEOUT_SECONDS: ${COMMAND_TIMEOUT_SECONDS:-300}
      RUNNER_JOB_LEASE_SECONDS: ${RUNNER_JOB_LEASE_SECONDS:-10}
      # Every tunable below defaults to the same value as config.py so the
      # deployed stack can be maintained entirely from .env (see .env.example).
      MAX_PARALLEL_TOOL_CALLS: ${MAX_PARALLEL_TOOL_CALLS:-2}
      TOOL_RESULT_SUMMARY_CHARS: ${TOOL_RESULT_SUMMARY_CHARS:-4000}
      TOOL_RESULT_SUMMARY_ITEMS: ${TOOL_RESULT_SUMMARY_ITEMS:-4}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      LLM_RETRY_BACKOFF_SECONDS: ${LLM_RETRY_BACKOFF_SECONDS:-2}
      REPLAN_MAX_COMPLETION_TOKENS: ${REPLAN_MAX_COMPLETION_TOKENS:-384}
      REPLAN_FAIL_STREAK: ${REPLAN_FAIL_STREAK:-4}
      REPLAN_STUCK_STEPS: ${REPLAN_STUCK_STEPS:-8}
      REPLAN_MAX_RETRIES: ${REPLAN_MAX_RETRIES:-1}
      RUN_WORKER_LEASE_SECONDS: ${RUN_WORKER_LEASE_SECONDS:-60}
      WEB_SEARCH_URL: ${WEB_SEARCH_URL:-http://searxng:8080/search}
      WEB_SEARCH_TIMEOUT_SECONDS: ${WEB_SEARCH_TIMEOUT_SECONDS:-15}
      # Retained for backwards compatibility; no longer the compaction trigger.
      CONTEXT_COMPACT_EVERY_STEPS: ${CONTEXT_COMPACT_EVERY_STEPS:-6}
      CONTEXT_COMPACT_KEEP_RECENT: ${CONTEXT_COMPACT_KEEP_RECENT:-4}

      # Executables the run_command tool may invoke (no shell metacharacters
      # are permitted regardless of this list).
      ALLOWED_COMMANDS: ${ALLOWED_COMMANDS:-git,ls,cat,pytest,python,python3,npm,node,make,grep,find,mypy,ruff,black,flake8}

      # Tier 2 scoped permissions. EDIT_ALLOWED_PATHS narrows write tools to
      # these workspace-relative directories (comma-separated); empty means a
      # full-write scope when write permission is granted. COMMAND_ALLOWLIST
      # optionally narrows ALLOWED_COMMANDS further for write-capable runs.
      # RUN_COMMANDS_ALLOW_NETWORK moves command execution to the runner's
      # "network" tier; off by default so commands stay on the internal network.
      EDIT_ALLOWED_PATHS: ${EDIT_ALLOWED_PATHS:-}
      COMMAND_ALLOWLIST: ${COMMAND_ALLOWLIST:-}
      RUN_COMMANDS_ALLOW_NETWORK: ${RUN_COMMANDS_ALLOW_NETWORK:-false}

      CONTEXT_COMPACT_THRESHOLD_TOKENS: ${CONTEXT_COMPACT_THRESHOLD_TOKENS:-6000}
      MEMORY_ENABLED: ${MEMORY_ENABLED:-true}
      MEMORY_FOR_CODE_RUNS: ${MEMORY_FOR_CODE_RUNS:-false}
      GENERATED_MEMORY_ENABLED: ${GENERATED_MEMORY_ENABLED:-false}
      EMBED_MAX_CHARS: ${EMBED_MAX_CHARS:-6000}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-45}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      MEMORY_CONTEXT_TOKENS: ${MEMORY_CONTEXT_TOKENS:-1200}
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-10000000}
      MODEL_LIST_CACHE_SECONDS: ${MODEL_LIST_CACHE_SECONDS:-300}
      RUNNER_CPU_SECONDS: ${RUNNER_CPU_SECONDS:-300}
      RUNNER_MEMORY_MB: ${RUNNER_MEMORY_MB:-2048}
      RUNNER_MAX_OPEN_FILES: ${RUNNER_MAX_OPEN_FILES:-256}
      RUN_EVENT_BATCH_CHARS: ${RUN_EVENT_BATCH_CHARS:-2048}
      RUN_EVENT_BATCH_SECONDS: ${RUN_EVENT_BATCH_SECONDS:-0.50}

      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-true}
      # 8 MB accommodates typical audited annual-report PDFs. Lower this on
      # constrained networks or raise it for unusually large filings.
      WEB_FETCH_MAX_BYTES: ${WEB_FETCH_MAX_BYTES:-8000000}

      # Optional Automatic1111/Forge-compatible local image generator.
      IMAGE_GENERATION_URL: ${IMAGE_GENERATION_URL:-}
      IMAGE_GENERATION_TIMEOUT_SECONDS: ${IMAGE_GENERATION_TIMEOUT_SECONDS:-180}

    ports:
      - "8081:8000"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
    # The server container merges approved sandbox diffs directly into the
    # host bind-mounted workspace, which is owned by the host user's UID.
    # Without DAC_OVERRIDE the root process cannot write into those 775
    # subdirectories and approvals fail to land.
    cap_add:
      - DAC_OVERRIDE

    pids_limit: 256
    mem_limit: ${AGENT_MEMORY_LIMIT:-2g}
    cpus: ${AGENT_CPUS:-0.50}

    depends_on:
      agent-runner:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
      searxng:
        condition: service_started

    networks:
      - ai
      - proxy

  agent-runner:
    image: ai-stack-server:latest
    container_name: agent-runner
    restart: unless-stopped
    command: ["uvicorn", "app.runner:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      RUNNER_API_KEY: ${RUNNER_API_KEY:-${AGENT_API_KEY}}
      SANDBOX_ROOT: ${SANDBOX_ROOT:-/sandboxes}
      COMMAND_TIMEOUT_SECONDS: ${COMMAND_TIMEOUT_SECONDS:-300}
      RUNNER_CPU_SECONDS: ${RUNNER_CPU_SECONDS:-300}
      RUNNER_MEMORY_MB: ${RUNNER_MEMORY_MB:-4096}
      RUNNER_MAX_OPEN_FILES: ${RUNNER_MAX_OPEN_FILES:-256}
      # The "isolated" tier requires a private user/network namespace and
      # rejects the command if unshare cannot enforce it. Verify unprivileged
      # user namespaces are enabled on the Docker host before deployment.
      RUNNER_ENABLE_NETNS: ${RUNNER_ENABLE_NETNS:-true}
      ALLOWED_COMMANDS: ${ALLOWED_COMMANDS:-git,pytest,python,python3,npm,node,make,mypy,ruff,black,flake8}
    volumes:
      - ./agent-sandboxes:/sandboxes
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: ${RUNNER_MEMORY_LIMIT:-768m}
    cpus: ${RUNNER_CPUS:-0.25}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - ai

  ####################################################
  ## Runs UI -- React/TypeScript coding task console
  ####################################################
  runs-ui:
    build: ./runs-ui
    image: ai-runs-ui:latest
    container_name: ai-runs-ui
    restart: unless-stopped

    depends_on:
      server:
        condition: service_healthy

    ports:
      - "3002:8080"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

    networks:
      - ai
      - proxy

networks:
  ai:
  proxy:
    external: true
